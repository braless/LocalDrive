; ============================================================
;  LocalDrive  示例配置
;  复制为 config.ini 后按需修改（config.ini 不入库）
;  改完在托盘图标右键菜单里点「重新加载配置」即可生效
;  也可以在资源管理器里右键程序图标 →「编辑配置」直接打开
; ============================================================

[site]
; 网页左上角显示的名称
name = 文件服务

; 浏览器标签页标题；留空 = 与上面的 name 相同
title = 

; 页面底部的介绍文字；留空 = 不显示该行
footer = 由 LocalDrive 提供

; 浏览器标签图标（favicon）。可填：
;   1) 图片文件路径 —— 相对路径按程序目录解析，支持 png / ico / jpg / gif / webp / svg
;   2) emoji 或 1-4 个字符 —— 自动生成纯色图标
;   3) 内联 <svg>...</svg> 片段
;   4) http(s):// 图片地址
;   5) data:image/...;base64,...
; 留空 = 使用内置图标
favicon = 

[server]
; HTTP 监听端口；被占用时会自动向后顺延寻找可用端口
port = 8080

; 启动后是否自动打开浏览器
autoOpen = false

[paths]
; 网页上要展示的目录，可以写多个，用 | 分隔；也可以一行写一个
;   只配一个目录 → 网页直接展示该目录下的文件
;   配多个目录   → 网页先展示目录列表，再进入各自的下一级
; 留空 = 不展示任何目录（只保留下面「发布」的临时目录）
; 例： roots = D:\共享资料 | E:\照片
roots = 

; 「发布」文件的临时存放目录，留空 = <程序目录>\published
; 里面的文件是临时的，会按 [publish] ttlMinutes 自动清理
publishDir = 

[publish]
; 发布文件的保留时长（分钟）。到期后自动删除；填 0 表示不自动清理
ttlMinutes = 60

[network]
; 生成分享链接时使用的本机 IP，留空 = 自动选择（优先 192.168.x）
urlHost = 

; 对外访问地址前缀，用于生成分享链接。反向代理 / 域名访问时填这里
; 例：https://files.example.com  或  http://nas.local:8080
; 留空 = http://<上面的 IP>:<端口>
publicURL = 

[listing]
; 是否列举以 . 开头的隐藏文件
showHidden = false

; 网页列表每页显示条数
pageSize = 100

; 全量列举接口的文件数量上限
maxFiles = 20000

[hide]
; 按扩展名隐藏文件（不区分大小写，逗号分隔，不用写点号）
types = tmp, temp, log, bak, swp, swo, lock, pyc

; 按文件名 / 文件夹名通配符隐藏（支持 * 和 ?，逗号分隔）
rules = ~$*, .git, .svn, node_modules, Thumbs.db, desktop.ini
