name: Release

# 推一个 v* 标签即可自动构建三平台并发布到 Releases：
#   git tag v2.4.0 && git push origin v2.4.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: LocalDrive-windows-amd64.exe
            ldflags: '-s -w -H windowsgui'
          - goos: linux
            goarch: amd64
            output: LocalDrive-linux-amd64
            ldflags: '-s -w'
          - goos: linux
            goarch: arm64
            output: LocalDrive-linux-arm64
            ldflags: '-s -w'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "${{ matrix.ldflags }}" -o "${{ matrix.output }}" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 收集所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          # 排除 checksums.txt 自身，避免把空文件也算进去
          sha256sum $(ls | grep -v '^checksums\.txt$') > checksums.txt
          cat checksums.txt

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
