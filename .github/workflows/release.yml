name: Release

# 推一个 v* 标签即可自动构建三平台并发布到 Releases：
#   git tag v2.5.0 && git push origin v2.5.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 手动触发时明确告知「不会创建 Release」。
  # 否则 release job 因 ref 不是标签而被静默跳过，整次运行显示绿色，
  # 很容易误以为发版成功。
  notice:
    name: 手动触发说明
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 说明本次不发布
        run: |
          echo "::warning::本次为手动触发，只编译不创建 Release。要正式发版请推送 v* 标签。"
          {
            echo "### ⚠️ 本次未创建 Release"
            echo ""
            echo "手动触发只做编译验证。三个平台的二进制已作为 workflow artifact 上传，"
            echo "可在本次运行页面底部下载。"
            echo ""
            echo "要正式发版，推送一个 \`v*\` 标签："
            echo ""
            echo '```bash'
            echo "git tag v2.5.0"
            echo "git push origin v2.5.0"
            echo '```'
            echo ""
            echo "标签推送会触发完整流程：三平台编译 → 生成校验和 → 创建 Release。"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: LocalDrive-windows-amd64.exe
            ldflags: '-s -w -H windowsgui'
          - goos: linux
            goarch: amd64
            output: LocalDrive-linux-amd64
            ldflags: '-s -w'
          - goos: linux
            goarch: arm64
            output: LocalDrive-linux-arm64
            ldflags: '-s -w'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "${{ matrix.ldflags }}" -o "${{ matrix.output }}" .

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 收集所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          # 排除 checksums.txt 自身，避免把空文件也算进去
          sha256sum $(ls | grep -v '^checksums\.txt$') > checksums.txt
          cat checksums.txt

      - name: 创建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
