; ============================================================
;  LocalDrive 容器内默认配置
;  覆盖方式：-v /path/to/config.ini:/app/config.ini:ro
;
;  容器内三个约定路径：
;    /share  展示目录（挂载宿主机目录进来）
;    /data   持久化：日志、state.json、发布临时目录
;    /app    程序与配置
; ============================================================

[site]
name = 文件服务
title = 
footer = 由 LocalDrive 提供
favicon = 

[server]
port = 8080
; 容器内没有浏览器，保持 false
autoOpen = false

[paths]
; 要展示的目录；把宿主机目录挂到 /share 后即生效
; 多个目录用 | 分隔，也可以一行写一个
roots = /share

; 发布临时目录。必须指向可写且持久化的位置，
; 留空会退到 /app/published（容器重建即丢）
publishDir = /data/published

[publish]
ttlMinutes = 60

[network]
; 留空 = 自动挑本机网卡地址。⚠️ 容器里挑到的是 172.17.x.x，
; 宿主机以外的设备访问不到，务必显式填宿主机 IP
urlHost = 

; 反向代理 / 域名访问时填这里，优先级高于 urlHost
; 例：https://files.example.com
publicURL = 

[listing]
showHidden = false
pageSize = 100
maxFiles = 20000

[hide]
types = tmp, temp, log, bak, swp, swo, lock, pyc
rules = ~$*, .git, .svn, node_modules, Thumbs.db, desktop.ini
